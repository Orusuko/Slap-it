name: Deploy Slay It a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # No cancelar deploys en curso: un cancel a medias deja Pages en estado inconsistente.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      # Debe ir antes del build: base_path alimenta VITE_BASE_PATH del sitio de proyecto.
      # enablement: true intenta crear Pages con fuente "GitHub Actions" si aún no existe.
      # Nota: GITHUB_TOKEN a veces no basta para enablement; si falla, habilitar manualmente
      # en Settings > Pages > Build and deployment > Source: GitHub Actions.
      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Analizar código
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar la web
        run: npm run build:web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # base_path de Pages (p. ej. "/Slap-it"); Vite exige barra final.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
